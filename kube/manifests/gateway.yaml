---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: home-gateway
  namespace: default
spec:
  gatewayClassName: nginx
  infrastructure:
    annotations:
      metallb.io/address-pool: home-pool
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---
# Routes ianmyjer.com, www.ianmyjer.com, and direct LAN IP requests to ianmyjerdotcom.
# When adding other apps (e.g. ian.ianmyjer.com, food.ianmyjer.com), create separate
# HTTPRoutes with explicit `hostnames:` — Gateway API matches specific hostnames first.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ianmyjerdotcom
  namespace: default
spec:
  parentRefs:
    - name: home-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ianmyjerdotcom
          port: 80
