---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ianmyjerdotcom
  namespace: default
  labels:
    app: ianmyjerdotcom
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ianmyjerdotcom
  template:
    metadata:
      labels:
        app: ianmyjerdotcom
    spec:
      containers:
        - name: ianmyjerdotcom
          image: ghcr.io/enmyj/ianmyjerdotcom:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: ianmyjerdotcom
  namespace: default
spec:
  ports:
    - protocol: TCP
      name: http
      port: 80
      targetPort: 8080
  selector:
    app: ianmyjerdotcom
